<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .wordmark {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        font-weight: 800;
        font-size: 112px;
        letter-spacing: -0.045em;
        fill: #1B1C1E;
      }
      .subline {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        font-size: 20px;
        letter-spacing: 0.08em;
        fill: #1B1C1E;
        opacity: 0.78;
      }
    </style>
  </defs>

  <!-- Warm Sentinel Yellow Background -->
  <rect width="1200" height="630" fill="#ECC33E"/>

  <!-- Subtle Hairline Frame -->
  <rect x="36" y="36" width="1128" height="558" rx="20" stroke="#1B1C1E" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Main Lockup Group -->
  <g transform="translate(150, 145)">
    <g transform="scale(1.15)" fill="#1B1C1E">
      <path d="M 132 30
               C 132 24, 144 24, 146 31
               C 158 76, 180 98, 225 110
               C 232 112, 232 124, 226 124
               C 166 116, 140 90, 132 30 Z" />
      <path d="M 132 30
               C 132 24, 144 24, 146 31
               C 158 76, 180 98, 225 110
               C 232 112, 232 124, 226 124
               C 166 116, 140 90, 132 30 Z" transform="rotate(90 128 128)" />
      <path d="M 132 30
               C 132 24, 144 24, 146 31
               C 158 76, 180 98, 225 110
               C 232 112, 232 124, 226 124
               C 166 116, 140 90, 132 30 Z" transform="rotate(180 128 128)" />
      <path d="M 132 30
               C 132 24, 144 24, 146 31
               C 158 76, 180 98, 225 110
               C 232 112, 232 124, 226 124
               C 166 116, 140 90, 132 30 Z" transform="rotate(270 128 128)" />
      <path d="M 128 84
               Q 135 121 172 128
               Q 135 135 128 172
               Q 121 135 84 128
               Q 121 121 128 84 Z" />
    </g>

    <!-- Wordmark -->
    <text x="330" y="138" class="wordmark">after hours</text>
    <text x="330" y="238" class="wordmark">sentinel</text>
  </g>

  <!-- Bottom Telemetry Strip -->
  <text x="600" y="546" text-anchor="middle" class="subline">7×24 EVENT-DRIVEN rTOKEN DIVERGENCE AGENT · BITGET AI BASE CAMP S2</text>
</svg>
