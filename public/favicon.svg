<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- Warm Sentinel Yellow Background -->
  <rect width="256" height="256" rx="44" fill="#ECC33E"/>

  <!-- 4 Outer Curved Petals (90-degree rotational symmetry around 128,128) -->
  <g fill="#1B1C1E">
    <!-- Top-Right Petal: narrow cardinal gap, thicker inner elbow -->
    <path d="M 132 30
             C 132 24, 144 24, 146 31
             C 158 76, 180 98, 225 110
             C 232 112, 232 124, 226 124
             C 166 116, 140 90, 132 30 Z" />
    <path d="M 132 30
             C 132 24, 144 24, 146 31
             C 158 76, 180 98, 225 110
             C 232 112, 232 124, 226 124
             C 166 116, 140 90, 132 30 Z" transform="rotate(90 128 128)" />
    <path d="M 132 30
             C 132 24, 144 24, 146 31
             C 158 76, 180 98, 225 110
             C 232 112, 232 124, 226 124
             C 166 116, 140 90, 132 30 Z" transform="rotate(180 128 128)" />
    <path d="M 132 30
             C 132 24, 144 24, 146 31
             C 158 76, 180 98, 225 110
             C 232 112, 232 124, 226 124
             C 166 116, 140 90, 132 30 Z" transform="rotate(270 128 128)" />

    <!-- Central 4-Pointed Concave Diamond Star -->
    <path d="M 128 84
             Q 135 121 172 128
             Q 135 135 128 172
             Q 121 135 84 128
             Q 121 121 128 84 Z" />
  </g>
</svg>
