<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .wordmark {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        font-weight: 800;
        font-size: 98px;
        letter-spacing: -0.045em;
        fill: #1B1C1E;
      }
    </style>
  </defs>

  <!-- Warm Sentinel Yellow Background -->
  <rect width="960" height="320" rx="24" fill="#ECC33E"/>

  <!-- Sentinel Star Icon Mark -->
  <g transform="translate(48, 32)" fill="#1B1C1E">
    <path d="M 132 30
             C 132 24, 144 24, 146 31
             C 158 76, 180 98, 225 110
             C 232 112, 232 124, 226 124
             C 166 116, 140 90, 132 30 Z" />
    <path d="M 132 30
             C 132 24, 144 24, 146 31
             C 158 76, 180 98, 225 110
             C 232 112, 232 124, 226 124
             C 166 116, 140 90, 132 30 Z" transform="rotate(90 128 128)" />
    <path d="M 132 30
             C 132 24, 144 24, 146 31
             C 158 76, 180 98, 225 110
             C 232 112, 232 124, 226 124
             C 166 116, 140 90, 132 30 Z" transform="rotate(180 128 128)" />
    <path d="M 132 30
             C 132 24, 144 24, 146 31
             C 158 76, 180 98, 225 110
             C 232 112, 232 124, 226 124
             C 166 116, 140 90, 132 30 Z" transform="rotate(270 128 128)" />
    <path d="M 128 84
             Q 135 121 172 128
             Q 135 135 128 172
             Q 121 135 84 128
             Q 121 121 128 84 Z" />
  </g>

  <!-- Two-Line Lowercase Wordmark -->
  <text x="328" y="148" class="wordmark">after hours</text>
  <text x="328" y="236" class="wordmark">sentinel</text>
</svg>
